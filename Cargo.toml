[workspace]
resolver = "3"
members = ["crates/*", "apps/snappy", "apps/app/src-tauri"]

[workspace.package]
version = "0.1.0"
authors = ["Syed Zaidi"]
repository = "https://github.com/farhadzaidi/snappy"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
