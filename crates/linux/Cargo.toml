[package]
name = "snappy-linux"
edition.workspace = true
publish.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "What Snappy's Linux adapters share."

[target.'cfg(target_os = "linux")'.dependencies]
snappy-core = { path = "../core" }
snappy-platform = { path = "../platform" }
serde.workspace = true
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
