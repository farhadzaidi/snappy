[package]
name = "snappy-kwin"
edition.workspace = true
publish.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Snappy's adapter for KDE Plasma on Wayland, through its KWin script."

[target.'cfg(target_os = "linux")'.dependencies]
snappy-core = { path = "../core" }
snappy-platform = { path = "../platform" }
snappy-linux = { path = "../linux" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
snappy-kwin = { path = ".", features = ["reference"] }
snappy-engine = { path = "../engine" }

[features]
# The `reference` module, for tests and the live harness only.
reference = []

[lints]
workspace = true
