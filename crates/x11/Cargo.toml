[package]
name = "snappy-x11"
edition.workspace = true
publish.workspace = true
license.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
snappy-core = { path = "../core" }
snappy-platform = { path = "../platform" }
snappy-linux = { path = "../linux" }
thiserror.workspace = true
x11rb = { version = "0.14", default-features = false, features = [
    "randr",
    "shape",
    "xfixes",
    "xinput",
    "xkb",
] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.14", default-features = false, features = ["xtest"] }

[lints]
workspace = true
