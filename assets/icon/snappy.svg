<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Snappy's app icon: a half zone, lit, beside two empty quarter zones. tools/icon/generate.sh renders every platform's icon files from this one. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2026"/>
      <stop offset="1" stop-color="#0F1216"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#A8F6DC"/>
      <stop offset="1" stop-color="#5FD6AF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" color-interpolation-filters="sRGB" x="-40%" y="-30%" width="180%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000000" fill-opacity="0.35" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- Empty quarter zones on the right -->
  <rect x="540" y="232" width="284" height="254" rx="44" fill="#7DE8C5" fill-opacity="0.26"/>
  <rect x="540" y="538" width="284" height="254" rx="44" fill="#7DE8C5" fill-opacity="0.26"/>

  <!-- Lit half zone on the left -->
  <rect x="200" y="232" width="288" height="560" rx="44" fill="#7DE8C5" opacity="0.5" filter="url(#glow)"/>
  <rect x="200" y="232" width="288" height="560" rx="44" fill="url(#mint)"/>
  <rect x="214" y="242" width="260" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.45"/>
</svg>
