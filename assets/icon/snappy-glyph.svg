<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="#000000">
  <!-- The app icon as a monochrome glyph for the menu bar, trays, and the GNOME top bar: a window with the lit half zone beside two dimmer quarter zones. tools/icon/generate.sh renders the macOS and GNOME files from this one, and snappy_platform::glyph draws the same shapes for the trays that take pixels. Every shape is a fill, since GNOME recolors a symbolic icon by setting the fill of every shape. -->
