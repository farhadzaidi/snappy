# Packs Snappy as an MSIX bundle for x64 and Arm64 and submits it to the Microsoft Store, which
# signs it. docs/releasing/microsoft-store.md covers the one-time setup.
#
# Submitting needs the secrets MS_STORE_TENANT_ID, MS_STORE_SELLER_ID, MS_STORE_CLIENT_ID, and
# MS_STORE_CLIENT_SECRET, and the variables MS_STORE_PRODUCT_ID, MSIX_IDENTITY_NAME, and
# MSIX_PUBLISHER. Without them the bundle is still built and kept as an artifact.
name: Microsoft Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as v0.1.0
        required: true
        type: string
      dry-run:
        description: Build the bundle without submitting it
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: microsoft-store-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Dry runs without the Store's identity still pack, under a stand-in name and publisher.
  MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Snappy.DryRun' }}
  MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Snappy Dry Run' }}

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The tag matches the version
        run: |
          $version = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -EQ 'snappy').version
          if ($env:TAG.TrimStart('v') -ne $version) {
            throw "Tag $env:TAG doesn't match the Cargo version $version."
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: wasm-bindgen
        run: cargo install --locked wasm-bindgen-cli --version $env:WASM_BINDGEN_VERSION
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/app/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/app/ui/pnpm-lock.yaml
      - run: pnpm -C apps/app/ui install --frozen-lockfile
      - run: pnpm -C apps/app/ui build
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p snappy -p snappy-app
      - name: Pack
        run: tools/release/msix.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.arch }}
          path: target/msix/packages/*.msix
          if-no-files-found: error

  bundle:
    needs: package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: msix-*
          path: target/msix/packages
          merge-multiple: true
      - name: Bundle
        run: tools/release/msix.ps1 -Bundle
      - uses: actions/upload-artifact@v4
        with:
          name: msixbundle
          path: |
            target/msix/*.msixbundle
            target/msix/*.msixupload
          if-no-files-found: error

  submit:
    needs: bundle
    if: github.event_name == 'release' || !inputs.dry-run
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
      SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
      CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
      # The bundle carries the package's identity, so one packed under the stand-in can't go.
      IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
    steps:
      - name: Check the Store's settings
        id: settings
        run: |
          $names = [ordered]@{
            TENANT_ID = 'MS_STORE_TENANT_ID'; SELLER_ID = 'MS_STORE_SELLER_ID'
            CLIENT_ID = 'MS_STORE_CLIENT_ID'; CLIENT_SECRET = 'MS_STORE_CLIENT_SECRET'
            PRODUCT_ID = 'MS_STORE_PRODUCT_ID'; IDENTITY_NAME = 'MSIX_IDENTITY_NAME'
            PUBLISHER = 'MSIX_PUBLISHER'
          }
          $missing = @($names.Keys | Where-Object { -not [Environment]::GetEnvironmentVariable($_) } |
            ForEach-Object { $names[$_] })
          if ($missing.Count -gt 0) {
            Write-Output "::notice::Not submitting to the Microsoft Store: $($missing -join ', ') not set. The bundle is in this run's artifacts."
            "ready=false" >> $env:GITHUB_OUTPUT
          } else {
            "ready=true" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/download-artifact@v4
        if: steps.settings.outputs.ready == 'true'
        with:
          name: msixbundle
          path: msix
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: steps.settings.outputs.ready == 'true'
      - name: Sign in to Partner Center
        if: steps.settings.outputs.ready == 'true'
        run: >
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID
          --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
      - name: Submit
        if: steps.settings.outputs.ready == 'true'
        run: |
          $upload = Get-ChildItem msix -Filter *.msixupload | Select-Object -First 1
          msstore publish $upload.FullName -id $env:PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed with exit code $LASTEXITCODE." }
