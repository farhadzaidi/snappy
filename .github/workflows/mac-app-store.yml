name: Mac App Store

# Builds the Mac App Store package for a release and sends it to App Store Connect, where it
# waits to be submitted for review. Without the signing secrets it still builds the store
# variant, signed ad hoc, and keeps the package as an artifact, so the build stays checked.
# docs/releasing/mac-app-store.md lists the secrets and the one-time setup.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, such as v0.1.0"
        required: true
      dry-run:
        description: "Build and sign, but don't upload"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mac-app-store-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  package:
    runs-on: macos-15
    env:
      SIGNED: ${{ secrets.MAS_CERTIFICATE_P12 != '' }}
      CAN_UPLOAD: ${{ secrets.APP_STORE_CONNECT_KEY_P8 != '' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: The tag names Snappy's version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "snappy"))')"
          if [[ "${TAG#v}" != "$version" ]]; then
            echo "::error::The tag $TAG doesn't match Snappy's version, $version."
            exit 1
          fi

      # App Store Connect turns away builds made with an SDK older than it requires, so use
      # the newest Xcode release on the runner, never a beta.
      - name: Use the newest Xcode
        run: |
          xcode="$(python3 -c 'import glob, re
          apps = [a for a in glob.glob("/Applications/Xcode_*.app") if re.fullmatch(r"/Applications/Xcode_[0-9.]+\.app", a)]
          print(max(apps, key=lambda a: [int(n) for n in re.findall(r"[0-9]+", a)]))')"
          sudo xcode-select --switch "$xcode"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)"
          cargo install --locked wasm-bindgen-cli --version "$version"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/app/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/app/ui/pnpm-lock.yaml
      - run: pnpm -C apps/app/ui install --frozen-lockfile

      - name: Signing identities and provisioning profile
        if: env.SIGNED == 'true'
        env:
          MAS_CERTIFICATE_P12: ${{ secrets.MAS_CERTIFICATE_P12 }}
          MAS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MAS_INSTALLER_CERTIFICATE_P12 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/app-store.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          for certificate in MAS_CERTIFICATE_P12 MAS_INSTALLER_CERTIFICATE_P12; do
            base64 --decode <<<"${!certificate}" >"$RUNNER_TEMP/$certificate.p12"
            security import "$RUNNER_TEMP/$certificate.p12" -k "$keychain" -f pkcs12 \
              -P "$MAS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/$certificate.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$keychain"
          base64 --decode <<<"$MAS_PROVISION_PROFILE" >"$RUNNER_TEMP/Snappy.provisionprofile"
          {
            echo "MAS_KEYCHAIN=$keychain"
            echo "MAS_PROVISION_PROFILE=$RUNNER_TEMP/Snappy.provisionprofile"
          } >>"$GITHUB_ENV"

      # The build number only grows, as App Store Connect requires of every upload.
      - name: Build the package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$SIGNED" == true ]]; then
            tools/macos/app-store.sh signed
          else
            echo "::notice::No signing secrets, so the package is signed ad hoc and can't be uploaded."
            tools/macos/app-store.sh unsigned
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app-store-${{ env.TAG }}
          path: dist/app-store/*.pkg
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: env.SIGNED == 'true' && env.CAN_UPLOAD == 'true' && env.DRY_RUN != 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          (umask 077 && base64 --decode <<<"$APP_STORE_CONNECT_KEY_P8" >"$keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8")
          tools/macos/app-store.sh upload dist/app-store/Snappy-"${TAG#v}".pkg

      - name: Remove the keys
        if: always()
        run: |
          if [[ -n "${MAS_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MAS_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/Snappy.provisionprofile" "$HOME"/.appstoreconnect/private_keys/AuthKey_*.p8
