name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  # Formatting, lints, every Rust test that runs without a desktop, the settings UI's checks,
  # and its end-to-end tests in Chromium and WebKit.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the settings app
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen
        run: cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/settings/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/settings/ui/pnpm-lock.yaml
      - run: pnpm -C apps/settings/ui install --frozen-lockfile
      - run: tools/check.sh
      - name: Settings UI end to end
        run: |
          pnpm -C apps/settings/ui exec playwright install --with-deps chromium webkit
          pnpm -C apps/settings/ui e2e

  # The macOS and Windows adapters compile only on their own systems. Their integration
  # tests drive a real desktop, so here they are linted and unit-tested.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            adapter: snappy-macos
          - os: windows-latest
            adapter: snappy-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p ${{ matrix.adapter }} -p snappy -p snappy-live --all-targets -- -D warnings
      - run: cargo test -p ${{ matrix.adapter }} --lib
