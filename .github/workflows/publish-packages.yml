name: Publish packages

# Updates Homebrew, winget, and the AUR when a release is published. Each channel is its own
# job and publishes only when its secret is set; docs/releasing/package-managers.md covers the
# one-time setup. A dry run renders and checks everything, and pushes nothing.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.1.0
        required: true
        type: string
      dry_run:
        description: Render and check the packages without publishing them
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-packages-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  DOCS: docs/releasing/package-managers.md

jobs:
  # Finds the release, reads its SHA256SUMS, and renders every channel's files from the
  # templates in packaging/.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::$TAG isn't a release tag like v1.2.3."
            exit 1
          fi
          if ! state="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"; then
            echo "::error::There's no published release for $TAG. Publish it first, or render the packages locally as $DOCS describes."
            exit 1
          fi
          read -r draft prerelease <<<"$state"
          publish=true
          if [[ "$draft" == true ]]; then
            echo "::error::$TAG is still a draft. Publish it first, or render the packages locally as $DOCS describes."
            exit 1
          elif [[ "$prerelease" == true || "$TAG" == *-* ]]; then
            echo "::notice title=Prerelease::$TAG is a prerelease, so it isn't published to package managers."
            publish=false
          fi
          {
            echo "publish=$publish"
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "dry_run=${DRY_RUN:-false}"
          } >>"$GITHUB_OUTPUT"
      - name: Render the packages
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p target/release-files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir target/release-files
          tools/release/render-packages.sh "$VERSION" target/release-files/SHA256SUMS target/packages
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: packages
          path: target/packages/
          if-no-files-found: error

  homebrew:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    # brew style and brew audit are surest on macOS.
    runs-on: macos-latest
    env:
      HAS_SECRET: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      VERSION: ${{ needs.prepare.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Show the cask
        run: cat packages/homebrew/Casks/snappy.rb
      - name: Check the cask
        run: |
          # brew audits casks only by name, from a tap.
          brew tap-new --no-git snappy-check/local
          tap="$(brew --repository snappy-check/local)"
          mkdir -p "$tap/Casks"
          cp packages/homebrew/Casks/snappy.rb "$tap/Casks/snappy.rb"
          brew style --cask snappy-check/local/snappy
          # The online audit downloads the disk image. Its findings are reported, not fatal,
          # since Homebrew's rules change between its releases.
          brew audit --cask --online snappy-check/local/snappy \
            || echo "::warning title=brew audit::brew audit found problems with the cask. See the log above."
      - name: No token
        if: env.HAS_SECRET != 'true'
        run: echo "::notice title=Homebrew skipped::Add the HOMEBREW_TAP_TOKEN secret to publish the cask. See $DOCS."
      - uses: actions/checkout@v4
        if: env.HAS_SECRET == 'true' && env.DRY_RUN != 'true'
        with:
          repository: farhadzaidi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push the cask to the tap
        if: env.HAS_SECRET == 'true' && env.DRY_RUN != 'true'
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../packages/homebrew/Casks/snappy.rb Casks/snappy.rb
          git add Casks/snappy.rb
          if git diff --cached --quiet; then
            echo "::notice title=Homebrew::The tap already has Snappy $VERSION."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "snappy $VERSION"
          git push

  winget:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    env:
      HAS_SECRET: ${{ secrets.WINGET_TOKEN != '' }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PACKAGE: FarhadZaidi.Snappy
      KOMAC_VERSION: 2.17.2
      KOMAC_SHA256: b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Show the manifests from the templates
        run: |
          for manifest in packages/winget/manifests/f/FarhadZaidi/Snappy/"$VERSION"/*.yaml; do
            echo "== $manifest"
            cat "$manifest"
          done
      - name: No token
        if: env.HAS_SECRET != 'true'
        run: echo "::notice title=winget skipped::Add the WINGET_TOKEN secret to publish to winget. See $DOCS."
      - name: Check that winget has the package
        id: upstream
        if: env.HAS_SECRET == 'true'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/f/FarhadZaidi/Snappy" --silent; then
            echo "listed=true" >>"$GITHUB_OUTPUT"
          else
            echo "listed=false" >>"$GITHUB_OUTPUT"
            echo "::notice title=winget skipped::$PACKAGE isn't in winget yet. Its first version is submitted by hand; see $DOCS."
          fi
      - name: Install Komac
        if: steps.upstream.outputs.listed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/komac"
          cd "$RUNNER_TEMP/komac"
          curl -fsSLo komac.tar.gz \
            "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$KOMAC_SHA256  komac.tar.gz" | sha256sum --check
          tar -xzf komac.tar.gz komac
          echo "$RUNNER_TEMP/komac" >>"$GITHUB_PATH"
      - name: Update the package
        if: steps.upstream.outputs.listed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          releases="https://github.com/$GITHUB_REPOSITORY/releases"
          args=(
            update "$PACKAGE"
            --version "$VERSION"
            --urls "$releases/download/$TAG/Snappy-$VERSION-windows-x64.msi"
                   "$releases/download/$TAG/Snappy-$VERSION-windows-arm64.msi"
            --release-notes-url "$releases/tag/$TAG"
          )
          if [[ "$DRY_RUN" == true ]]; then
            komac "${args[@]}" --dry-run --output "$RUNNER_TEMP/winget"
            find "$RUNNER_TEMP/winget" -name '*.yaml' -print -exec cat {} \;
          else
            komac "${args[@]}" --submit
          fi

  aur:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    env:
      HAS_SECRET: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: target/packages
      - name: Show the PKGBUILD
        run: cat target/packages/aur/snappy-app-bin/PKGBUILD
      - name: Check the package in Arch Linux
        run: |
          docker run --rm -v "$PWD:/work" -w /work archlinux:base \
            tools/release/check-aur-package.sh target/packages/aur/snappy-app-bin --download
      - name: No key
        if: env.HAS_SECRET != 'true'
        run: echo "::notice title=AUR skipped::Add the AUR_SSH_PRIVATE_KEY secret to publish to the AUR. See $DOCS."
      - name: Push to the AUR
        if: env.HAS_SECRET == 'true' && env.DRY_RUN != 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: snappy-app-bin
          pkgbuild: target/packages/aur/snappy-app-bin/PKGBUILD
          commit_username: Syed Zaidi
          commit_email: 70859631+farhadzaidi@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.prepare.outputs.version }}
