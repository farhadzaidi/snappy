[package]
name = "snappy"
edition.workspace = true
publish.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
repository.workspace = true
description = "Snappy, which arranges windows into zones: the daemon."

[dependencies]
snappy-core = { path = "../../crates/core" }
snappy-engine = { path = "../../crates/engine" }
snappy-ipc = { path = "../../crates/ipc" }
snappy-platform = { path = "../../crates/platform" }
directories = "6"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
snappy-macos = { path = "../../crates/macos" }

[target.'cfg(target_os = "linux")'.dependencies]
snappy-gnome = { path = "../../crates/gnome" }
snappy-kwin = { path = "../../crates/kwin" }
snappy-linux = { path = "../../crates/linux" }
snappy-x11 = { path = "../../crates/x11" }

[target.'cfg(windows)'.dependencies]
snappy-windows = { path = "../../crates/windows" }

[features]
# The Mac App Store build (`tools/macos/app-store.sh`). See snappy-macos.
mac-app-store = ["snappy-macos/mac-app-store"]

[lints]
workspace = true
